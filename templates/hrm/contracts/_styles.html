{# CSS in mẫu in HĐLĐ — A4, Times New Roman #}
<style>
  @page { size: A4; margin: 18mm 16mm; }
  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 13pt; line-height: 1.5; color: #000;
    max-width: 210mm; margin: 0 auto; text-align: justify;
  }
  .center { text-align: center; }
  .right { text-align: right; }
  .upper { text-transform: uppercase; font-weight: bold; }
  .doc-title {
    font-size: 14pt; text-align: center; margin: 12px 0 6px;
    font-weight: bold; text-transform: uppercase;
  }
  .doc-no { text-align: center; font-size: 13pt; margin-bottom: 10px; }
  .legal-ref { font-size: 12.5pt; text-align: center; margin: 10px 0 14px; line-height: 1.45; }
  .legal-ref p { margin: 2px 0; }
  .party { margin: 10px 0; }
  .party-title { font-weight: bold; margin-bottom: 4px; }
  .article { margin-top: 14px; }
  .article-title { font-weight: bold; margin-bottom: 6px; }
  .sub { margin: 4px 0 4px 16px; }
  .sub-item { margin: 3px 0 3px 24px; }
  .bullet { margin: 2px 0 2px 32px; }
  .roman { margin: 6px 0 4px 8px; font-weight: bold; }
  table.pay { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12pt; }
  table.pay th, table.pay td { border: 1px solid #000; padding: 5px 8px; vertical-align: top; }
  table.pay th { background: #f5f5f5; font-weight: bold; }
  table.pay th.num, table.pay td.num { text-align: right; white-space: nowrap; }
  table.pay tr.unused td { color: #666; font-style: italic; }
  table.pay tr.summary td { background: #fafafa; }
  .note { font-size: 11.5pt; margin-top: 6px; color: #333; }
  .sign-row { display: flex; justify-content: space-between; margin-top: 40px; page-break-inside: avoid; }
  .sign-col { width: 46%; text-align: center; font-size: 12.5pt; }
  .sign-space { height: 72px; }
  .muted { color: #444; font-size: 11.5pt; }
  .intro { margin: 8px 0; }
  @media print { .no-print { display: none !important; } body { margin: 0; } }
</style>

{% extends "base.html" %}
{% block title %}Ca & tăng ca{% endblock %}
{% block content %}
<div class="container-fluid py-3">
  <h4>Ca làm việc & chính sách tăng ca</h4>
  <p class="text-muted small">Ca đêm crossing-midnight · tăng ca 150/200/300% · đêm +30% · tăng ca đêm +20%</p>
  <div class="row g-3">
    <div class="col-md-6">
      <div class="card"><div class="card-header fw-semibold">Ca</div>
        <div class="card-body p-0"><table class="table table-sm mb-0"><thead><tr><th>Mã</th><th>Tên</th><th>Giờ</th><th>Đêm</th></tr></thead>
        <tbody id="tbS"></tbody></table></div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-header fw-semibold">Chính sách tăng ca</div>
        <div class="card-body p-0"><table class="table table-sm mb-0"><thead><tr><th>Loại</th><th>Hệ số</th><th>Đêm</th><th>Tăng ca đêm</th></tr></thead>
        <tbody id="tbO"></tbody></table></div></div>
      <div class="card mt-3"><div class="card-header fw-semibold">Xem trước tăng ca</div>
        <div class="card-body row g-2">
          <div class="col-4"><input type="number" id="base" class="form-control form-control-sm" placeholder="Lương CB" value="10000000"></div>
          <div class="col-3"><input type="number" id="hrs" class="form-control form-control-sm" placeholder="Giờ tăng ca" value="2"></div>
          <div class="col-3">
            <select id="dtype" class="form-select form-select-sm">
              <option value="normal">Ngày thường</option>
              <option value="weekend">Nghỉ tuần</option>
              <option value="holiday">Lễ/Tết</option>
            </select>
          </div>
          <div class="col-2 form-check pt-1"><input class="form-check-input" type="checkbox" id="night"><label class="form-check-label small" for="night">Đêm</label></div>
          <div class="col-12"><button class="btn btn-sm btn-primary" onclick="preview()">Tính</button>
            <span id="out" class="ms-2 small"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const money=n=>new Intl.NumberFormat('vi-VN').format(Math.round(Number(n||0)));
async function load(){
  const d=await(await fetch('/api/hrm/shifts')).json();
  tbS.innerHTML=(d.shifts||[]).map(s=>`<tr><td>${s.code}</td><td>${s.name}</td>
    <td>${s.start_time}–${s.end_time}${s.crosses_midnight?' (+1 ngày)':''}</td>
    <td>${s.is_night?'Có':'—'}</td></tr>`).join('');
  tbO.innerHTML=(d.ot_policies||[]).map(p=>`<tr><td>${p.name}</td><td>${p.multiplier}</td>
    <td>+${Math.round((p.night_extra||0)*100)}%</td><td>+${Math.round((p.ot_night_extra||0)*100)}%</td></tr>`).join('');
}
async function preview(){
  const r=await(await fetch('/api/hrm/ot/preview',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({base_salary:base.value,hours:hrs.value,day_type:dtype.value,is_night:night.checked,standard_days:26})})).json();
  out.textContent = r.success
    ? `Tổng ${money(r.total)}đ · miễn thuế tăng ca ${money(r.tax_exempt_ot)}đ (đơn giá ${money(r.hourly_rate)}/h)`
    : (r.error||'Lỗi');
}
load();
</script>
{% endblock %}

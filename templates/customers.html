{% extends "base.html" %}
{% block head_extra %}
{% include 'partials/data_list_table_assets.html' %}
{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Quản Lý Khách Hàng</h3>
        <div class="d-flex gap-2">
            <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none;" onchange="importCustomers(event)">
            <button class="btn btn-info text-white" onclick="document.getElementById('importFile').click()">
                <i class="bi bi-upload"></i> Nhập Excel
            </button>
            <button class="btn btn-success" onclick="exportCustomers()">
                <i class="bi bi-download"></i> Xuất Excel
            </button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal" onclick="addCustomer()">
                + Thêm Khách Hàng
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="input-group mb-3">
                <input type="text" class="form-control" placeholder="Tìm theo mã, tên, SĐT, MST..." id="searchInput">
                <button class="btn btn-outline-secondary" onclick="searchCustomers()">Tìm</button>
                <button class="btn btn-outline-secondary" onclick="loadCustomers()">Tải lại</button>
            </div>

            <div class="table-responsive">
                <table class="table table-sm table-hover align-middle" id="customersTable">
                    <thead><tr></tr></thead>
                    <tbody>
                        <tr><td colspan="10" class="text-center text-muted">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="p-3 bg-light border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="enhanced-table-toolbar">
                    <span class="text-muted small">Hiển thị <strong id="customerTableCount">0</strong> khách hàng</span>
                    <span id="customerColFilters" class="active-filters-badge d-none"></span>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btnClearCustomerColFilters">Xóa lọc cột</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thêm Khách Hàng</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="customerForm">
                    <input type="hidden" id="customerId">
                    <div class="row g-3">
                        <div class="col-md-6" id="codeFieldWrap" style="display:none;">
                            <label class="form-label">Mã KH</label>
                            <input type="text" class="form-control bg-light" id="codeDisplay" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tên công ty</label>
                            <input type="text" class="form-control" id="companyName">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mã số thuế</label>
                            <input type="text" class="form-control" id="taxCode" placeholder="VD: 0301234567">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Điện thoại</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" class="form-control" id="address">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mã đơn vị NSNN</label>
                            <input type="text" class="form-control" id="budgetUnitCode">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số hộ chiếu</label>
                            <input type="text" class="form-control" id="passportNo">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-success" onclick="saveCustomer()">Lưu</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let customers = [];
let customerId = null;
let customerTableCtrl = null;
const modal = new bootstrap.Modal(document.getElementById('customerModal'));

function escHtml(s) {
    return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function renderCustomerRows(data, tbody) {
    const el = tbody || document.querySelector('#customersTable tbody');
    if (!el) return;
    if (!data.length) {
        el.innerHTML = '<tr><td colspan="10" class="text-center text-muted">Không tìm thấy khách hàng nào.</td></tr>';
        return;
    }
    el.innerHTML = data.map(c => `
        <tr data-id="${c.id}">
            <td class="text-center small">${escHtml(c.id)}</td>
            <td class="text-start"><strong>${escHtml(c.name)}</strong></td>
            <td class="text-start small">${escHtml(c.company_name || '—')}</td>
            <td class="text-center small">${escHtml(c.tax_code || '—')}</td>
            <td class="text-center small">${escHtml(c.phone || '—')}</td>
            <td class="text-start small">${escHtml(c.email || '—')}</td>
            <td class="text-start small">${escHtml(c.address || '—')}</td>
            <td class="text-center small">${escHtml(c.budget_unit_code || '—')}</td>
            <td class="text-center small">${escHtml(c.passport_no || '—')}</td>
            <td class="text-center">
                <button class="btn btn-sm btn-warning me-1" onclick="editCustomer(${c.id})">Sửa</button>
                <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.id})">Xóa</button>
            </td>
        </tr>`).join('');
}

function initCustomerTable() {
    customerTableCtrl = DataListTable.create({
        table: '#customersTable',
        countSelector: '#customerTableCount',
        activeFiltersSelector: '#customerColFilters',
        defaultSort: { key: 'id', dir: 'asc' },
        columns: [
            { key: 'id', label: 'Mã KH', sortable: true, filterType: 'number', width: '80px', align: 'center',
              getValue: c => c.id, sortValue: c => Number(c.id) || 0 },
            { key: 'name', label: 'Tên', sortable: true, filterType: 'text', width: '160px',
              getValue: c => c.name || '' },
            { key: 'company_name', label: 'Tên công ty', filterType: 'text', width: '160px',
              getValue: c => c.company_name || '' },
            { key: 'tax_code', label: 'Mã số thuế', filterType: 'text', width: '110px', align: 'center',
              getValue: c => c.tax_code || '' },
            { key: 'phone', label: 'Điện thoại', filterType: 'text', width: '110px', align: 'center',
              getValue: c => c.phone || '' },
            { key: 'email', label: 'Email', filterType: 'text', width: '140px',
              getValue: c => c.email || '' },
            { key: 'address', label: 'Địa chỉ', filterType: 'text', width: '180px',
              getValue: c => c.address || '' },
            { key: 'budget_unit_code', label: 'Mã ĐV NSNN', filterType: 'text', width: '100px', align: 'center',
              getValue: c => c.budget_unit_code || '' },
            { key: 'passport_no', label: 'Hộ chiếu', filterType: 'text', width: '100px', align: 'center',
              getValue: c => c.passport_no || '' },
            { key: 'actions', label: 'Hành động', filter: false, sortable: false, resizable: false, width: '140px', align: 'center' },
        ],
        renderRows: renderCustomerRows,
    });
}

function renderCustomersTable(data) {
    customers = data || [];
    if (customerTableCtrl) {
        customerTableCtrl.setData(customers);
    } else {
        renderCustomerRows(customers);
    }
}

function loadCustomers() {
    const tbody = document.querySelector('#customersTable tbody');
    tbody.innerHTML = '<tr><td colspan="10" class="text-center">Đang tải...</td></tr>';
    fetch('/api/customers')
        .then(r => r.ok ? r.json() : Promise.reject('Lỗi tải dữ liệu'))
        .then(data => {
            renderCustomersTable(data);
        })
        .catch(() => {
            tbody.innerHTML = '<tr><td colspan="10" class="text-center text-danger">Lỗi kết nối!</td></tr>';
        });
}

function searchCustomers() {
    const query = document.getElementById('searchInput').value.trim();
    fetch(`/api/customers?q=${encodeURIComponent(query)}`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => renderCustomersTable(data))
        .catch(() => alert('Lỗi tìm kiếm!'));
}

function addCustomer() {
    customerId = null;
    document.getElementById('modalTitle').textContent = 'Thêm Khách Hàng';
    document.getElementById('customerForm').reset();
    document.getElementById('customerId').value = '';
    document.getElementById('codeFieldWrap').style.display = 'none';
    modal.show();
}

function editCustomer(id) {
    const c = customers.find(x => x.id == id);
    if (!c) return;
    customerId = id;
    document.getElementById('modalTitle').textContent = 'Sửa Khách Hàng';
    document.getElementById('customerId').value = id;
    document.getElementById('codeDisplay').value = c.id;
    document.getElementById('codeFieldWrap').style.display = '';
    document.getElementById('name').value = c.name || '';
    document.getElementById('companyName').value = c.company_name || '';
    document.getElementById('taxCode').value = c.tax_code || '';
    document.getElementById('phone').value = c.phone || '';
    document.getElementById('email').value = c.email || '';
    document.getElementById('address').value = c.address || '';
    document.getElementById('budgetUnitCode').value = c.budget_unit_code || '';
    document.getElementById('passportNo').value = c.passport_no || '';
    modal.show();
}

function saveCustomer() {
    const data = {
        id: document.getElementById('customerId').value || undefined,
        name: document.getElementById('name').value.trim(),
        company_name: document.getElementById('companyName').value.trim(),
        tax_code: document.getElementById('taxCode').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        address: document.getElementById('address').value.trim(),
        budget_unit_code: document.getElementById('budgetUnitCode').value.trim(),
        passport_no: document.getElementById('passportNo').value.trim(),
    };

    if (!data.name) return alert('Tên khách hàng không được để trống!');

    const method = data.id ? 'PUT' : 'POST';
    fetch('/api/customers', {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
    })
    .then(r => r.ok ? r.json() : r.json().then(err => Promise.reject(err.error || 'Lỗi lưu')))
    .then(() => {
        modal.hide();
        loadCustomers();
        alert('Lưu thành công!');
    })
    .catch(err => alert('Lỗi: ' + err));
}

function deleteCustomer(id) {
    if (!confirm('Xóa khách hàng này?')) return;
    fetch('/api/customers', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
    })
    .then(r => r.ok ? r.json() : r.json().then(err => Promise.reject(err.error || 'Lỗi xóa')))
    .then(() => loadCustomers())
    .catch(err => alert('Lỗi: ' + err));
}

function exportCustomers() {
    if (!window.XLSX) return alert('Thư viện Excel chưa tải!');
    const data = customers.map(c => ({
        'Mã KH': c.id,
        'Tên': c.name || '',
        'Tên công ty': c.company_name || '',
        'Mã số thuế': c.tax_code || '',
        'Điện thoại': c.phone || '',
        'Email': c.email || '',
        'Địa chỉ': c.address || '',
        'Mã đơn vị NSNN': c.budget_unit_code || '',
        'Số hộ chiếu': c.passport_no || '',
    }));
    if (data.length === 0) return alert('Không có dữ liệu!');
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'KhachHang');
    XLSX.writeFile(wb, 'Danh_Sach_Khach_Hang.xlsx');
}

async function importCustomers(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';

    const loading = document.createElement('div');
    loading.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
    loading.innerHTML = '<div class="text-center text-white"><div class="spinner-border"></div><p>Đang nhập dữ liệu...</p></div>';
    document.body.appendChild(loading);

    try {
        const buffer = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = () => reject(new Error('Lỗi đọc file'));
            reader.readAsArrayBuffer(file);
        });

        const workbook = XLSX.read(buffer, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        if (rows.length < 2) throw new Error('File không có dữ liệu!');

        const headers = rows[0].map(h => String(h).trim().toUpperCase());
        const headerMap = {
            'TÊN': 'name',
            'TÊN CÔNG TY': 'company_name',
            'MÃ SỐ THUẾ': 'tax_code',
            'ĐIỆN THOẠI': 'phone',
            'EMAIL': 'email',
            'ĐỊA CHỈ': 'address',
            'MÃ ĐƠN VỊ NSNN': 'budget_unit_code',
            'SỐ HỘ CHIẾU': 'passport_no',
        };

        let ok = 0;
        let fail = 0;
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const obj = {};
            Object.keys(headerMap).forEach(key => {
                const idx = headers.indexOf(key);
                if (idx !== -1) obj[headerMap[key]] = String(row[idx] || '').trim();
            });
            if (!obj.name) continue;

            const res = await fetch('/api/customers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(obj),
            });
            if (res.ok) ok++;
            else fail++;
        }

        loadCustomers();
        alert(`Nhập xong: ${ok} thành công${fail ? `, ${fail} lỗi` : ''}.`);
    } catch (e) {
        alert('Lỗi: ' + e.message);
    } finally {
        loading.remove();
    }
}

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchCustomers();
});

initCustomerTable();
document.getElementById('btnClearCustomerColFilters')?.addEventListener('click', () => customerTableCtrl?.clearColumnFilters());
loadCustomers();
</script>
{% endblock %}

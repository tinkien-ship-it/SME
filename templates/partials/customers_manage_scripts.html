<script>
window.__CRM_CUSTOMERS_UI = {{ crm_ui|default(false)|tojson }};
let customers = [];
let customerId = null;
let customerTableCtrl = null;
let salesStaffMap = {};
let customerModal = null;

(function initCustomerModal() {
    const modalEl = document.getElementById('customerModal');
    if (modalEl && window.bootstrap) {
        customerModal = bootstrap.Modal.getOrCreateInstance(modalEl);
    }
})();

function customerColSpan() {
    return window.__CRM_CUSTOMERS_UI ? 10 : 9;
}

function customerDisplayPrimary(c) {
    const company = (c.company_name || '').trim();
    const name = (c.name || '').trim();
    return company || name || '';
}

function formatCustomerNameCell(c) {
    const company = (c.company_name || '').trim();
    const name = (c.name || '').trim();
    const primary = company || name || '—';
    let html = `<strong>${escHtml(primary)}</strong>`;
    if (company && name && company !== name) {
        html += `<div class="small text-muted">${escHtml(name)}</div>`;
    }
    return html;
}

function escHtml(s) {
    return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

async function loadSalesStaffOptions() {
    if (!window.__CRM_CUSTOMERS_UI) return;
    const wrap = document.getElementById('crmOwnerWrap');
    const sel = document.getElementById('crmOwner');
    if (wrap) wrap.style.display = '';
    if (!sel) return;
    try {
        const j = await (await fetch('/api/crm/assignable-users')).json();
        const items = j.items || j.sales_staff || [];
        salesStaffMap = {};
        items.forEach(u => { salesStaffMap[u.username] = u; });
        sel.innerHTML = '<option value="">— Chưa gán —</option>'
            + items.map(u => {
                const label = (u.full_name ? u.full_name + ' · ' : '') + u.username;
                return `<option value="${escHtml(u.username)}">${escHtml(label)}</option>`;
            }).join('');
    } catch (e) {
        sel.innerHTML = '<option value="">— Không tải được danh sách NV —</option>';
    }
}

function formatOwnerCell(c) {
    const o = (c.crm_owner || '').trim();
    if (!o) return '<span class="text-muted">—</span>';
    const u = salesStaffMap[o];
    if (u && u.full_name) {
        return `<span title="${escHtml(o)}">${escHtml(u.full_name)}</span>`
            + `<div class="small text-muted">${escHtml(o)}</div>`;
    }
    return escHtml(o);
}

function customerActionButtons(c) {
    const id = c.id;
    if (window.__CRM_CUSTOMERS_UI) {
        return `<a class="crm-btn crm-btn-ghost btn-sm me-1" href="/crm/customer/${id}" title="Hồ sơ 360°">360°</a>
                <button type="button" class="crm-btn crm-btn-ghost btn-sm me-1" onclick="editCustomer(${id})">Sửa</button>
                <button type="button" class="crm-btn crm-btn-ghost btn-sm text-danger" onclick="deleteCustomer(${id})">Xóa</button>`;
    }
    return `<a class="btn btn-sm btn-outline-primary me-1" href="/crm/customer/${id}" title="Hồ sơ CRM 360°">360°</a>
            <button class="btn btn-sm btn-warning me-1" onclick="editCustomer(${id})">Sửa</button>
            <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${id})">Xóa</button>`;
}

function renderCustomerRows(data, tbody) {
    const el = tbody || document.querySelector('#customersTable tbody');
    const colspan = customerColSpan();
    if (!el) return;
    if (!data.length) {
        el.innerHTML = `<tr><td colspan="${colspan}" class="text-center text-muted py-4">Không tìm thấy khách hàng nào.</td></tr>`;
        return;
    }
    el.innerHTML = data.map(c => {
        const ownerCol = window.__CRM_CUSTOMERS_UI
            ? `<td class="text-start small">${formatOwnerCell(c)}</td>` : '';
        return `
        <tr data-id="${c.id}">
            <td class="text-center small">${escHtml(c.id)}</td>
            <td class="text-start">${formatCustomerNameCell(c)}</td>
            <td class="text-center small">${escHtml(c.tax_code || '—')}</td>
            <td class="text-center small">${escHtml(c.phone || '—')}</td>
            ${ownerCol}
            <td class="text-start small">${escHtml(c.email || '—')}</td>
            <td class="text-start small">${escHtml(c.address || '—')}</td>
            <td class="text-center small">${escHtml(c.budget_unit_code || '—')}</td>
            <td class="text-center small">${escHtml(c.passport_no || '—')}</td>
            <td class="text-center text-nowrap">${customerActionButtons(c)}</td>
        </tr>`;
    }).join('');
}

function buildCustomerColumns() {
    const cols = [
        { key: 'id', label: 'Mã KH', sortable: true, filterType: 'number', width: '80px', align: 'center',
          getValue: c => c.id, sortValue: c => Number(c.id) || 0 },
        { key: 'customer_label', label: 'Tên Công Ty/ Khách Hàng', sortable: true, filterType: 'text', width: '220px',
          getValue: c => customerDisplayPrimary(c) || (c.name || ''),
          sortValue: c => customerDisplayPrimary(c).toLowerCase() },
        { key: 'tax_code', label: 'Mã số thuế', filterType: 'text', width: '110px', align: 'center',
          getValue: c => c.tax_code || '' },
        { key: 'phone', label: 'Điện thoại', filterType: 'text', width: '110px', align: 'center',
          getValue: c => c.phone || '' },
    ];
    if (window.__CRM_CUSTOMERS_UI) {
        cols.push({
            key: 'crm_owner', label: 'NV phụ trách', filterType: 'text', width: '130px',
            getValue: c => {
                const o = (c.crm_owner || '').trim();
                const u = salesStaffMap[o];
                return u ? (u.full_name || o) : o;
            },
        });
    }
    cols.push(
        { key: 'email', label: 'Email', filterType: 'text', width: '140px',
          getValue: c => c.email || '' },
        { key: 'address', label: 'Địa chỉ', filterType: 'text', width: '180px',
          getValue: c => c.address || '' },
        { key: 'budget_unit_code', label: 'Mã ĐV NSNN', filterType: 'text', width: '100px', align: 'center',
          getValue: c => c.budget_unit_code || '' },
        { key: 'passport_no', label: 'Hộ chiếu', filterType: 'text', width: '100px', align: 'center',
          getValue: c => c.passport_no || '' },
        { key: 'actions', label: 'Hành động', filter: false, sortable: false, resizable: false, width: '200px', align: 'center' },
    );
    return cols;
}

function initCustomerTable() {
    if (typeof DataListTable === 'undefined') {
        console.warn('DataListTable chưa tải — hiển thị bảng cơ bản');
        return;
    }
    customerTableCtrl = DataListTable.create({
        table: '#customersTable',
        countSelector: '#customerTableCount',
        activeFiltersSelector: '#customerColFilters',
        defaultSort: { key: 'id', dir: 'asc' },
        columns: buildCustomerColumns(),
        renderRows: renderCustomerRows,
    });
}

function renderCustomersTable(data) {
    customers = data || [];
    if (customerTableCtrl) {
        customerTableCtrl.setData(customers);
    } else {
        renderCustomerRows(customers);
    }
}

function loadCustomers() {
    const tbody = document.querySelector('#customersTable tbody');
    const colspan = customerColSpan();
    tbody.innerHTML = `<tr><td colspan="${colspan}" class="text-center py-4">Đang tải...</td></tr>`;
    fetch('/api/customers')
        .then(r => r.ok ? r.json() : Promise.reject('Lỗi tải dữ liệu'))
        .then(data => renderCustomersTable(data))
        .catch(() => {
            tbody.innerHTML = `<tr><td colspan="${colspan}" class="text-center text-danger py-4">Lỗi kết nối!</td></tr>`;
        });
}

function searchCustomers() {
    const query = document.getElementById('searchInput').value.trim();
    fetch(`/api/customers?q=${encodeURIComponent(query)}`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => renderCustomersTable(data))
        .catch(() => alert('Lỗi tìm kiếm!'));
}

function addCustomer() {
    customerId = null;
    document.getElementById('modalTitle').textContent = 'Thêm Khách Hàng';
    document.getElementById('customerForm').reset();
    document.getElementById('customerId').value = '';
    document.getElementById('codeFieldWrap').style.display = 'none';
    const ownerSel = document.getElementById('crmOwner');
    if (ownerSel) ownerSel.value = '';
    customerModal?.show();
}

function editCustomer(id) {
    const c = customers.find(x => x.id == id);
    if (!c) return;
    customerId = id;
    document.getElementById('modalTitle').textContent = 'Sửa Khách Hàng';
    document.getElementById('customerId').value = id;
    document.getElementById('codeDisplay').value = c.id;
    document.getElementById('codeFieldWrap').style.display = '';
    document.getElementById('name').value = c.name || '';
    document.getElementById('companyName').value = c.company_name || '';
    document.getElementById('taxCode').value = c.tax_code || '';
    document.getElementById('phone').value = c.phone || '';
    document.getElementById('email').value = c.email || '';
    document.getElementById('address').value = c.address || '';
    document.getElementById('budgetUnitCode').value = c.budget_unit_code || '';
    document.getElementById('passportNo').value = c.passport_no || '';
    const ownerSel = document.getElementById('crmOwner');
    if (ownerSel) ownerSel.value = (c.crm_owner || '').trim();
    customerModal?.show();
}

function saveCustomer() {
    const data = {
        id: document.getElementById('customerId').value || undefined,
        name: document.getElementById('name').value.trim(),
        company_name: document.getElementById('companyName').value.trim(),
        tax_code: document.getElementById('taxCode').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        address: document.getElementById('address').value.trim(),
        budget_unit_code: document.getElementById('budgetUnitCode').value.trim(),
        passport_no: document.getElementById('passportNo').value.trim(),
    };
    if (window.__CRM_CUSTOMERS_UI) {
        const ownerSel = document.getElementById('crmOwner');
        data.crm_owner = ownerSel ? ownerSel.value.trim() : '';
    }

    if (!data.name) return alert('Tên khách hàng không được để trống!');

    const method = data.id ? 'PUT' : 'POST';
    fetch('/api/customers', {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
    })
    .then(r => r.ok ? r.json() : r.json().then(err => Promise.reject(err.error || 'Lỗi lưu')))
    .then(() => {
        customerModal?.hide();
        loadCustomers();
        alert('Lưu thành công!');
    })
    .catch(err => alert('Lỗi: ' + err));
}

function deleteCustomer(id) {
    if (!confirm('Xóa khách hàng này?')) return;
    fetch('/api/customers', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
    })
    .then(r => r.ok ? r.json() : r.json().then(err => Promise.reject(err.error || 'Lỗi xóa')))
    .then(() => loadCustomers())
    .catch(err => alert('Lỗi: ' + err));
}

function exportCustomers() {
    if (!window.XLSX) return alert('Thư viện Excel chưa tải!');
    const data = customers.map(c => {
        const row = {
            'Mã KH': c.id,
            'Tên Công Ty/ Khách Hàng': customerDisplayPrimary(c) || c.name || '',
            'Mã số thuế': c.tax_code || '',
            'Điện thoại': c.phone || '',
        };
        if (window.__CRM_CUSTOMERS_UI) {
            const o = (c.crm_owner || '').trim();
            const u = salesStaffMap[o];
            row['NV phụ trách'] = u && u.full_name ? `${u.full_name} (${o})` : o;
        }
        row['Email'] = c.email || '';
        row['Địa chỉ'] = c.address || '';
        row['Mã đơn vị NSNN'] = c.budget_unit_code || '';
        row['Số hộ chiếu'] = c.passport_no || '';
        return row;
    });
    if (data.length === 0) return alert('Không có dữ liệu!');
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'KhachHang');
    XLSX.writeFile(wb, 'Danh_Sach_Khach_Hang.xlsx');
}

async function importCustomers(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = '';

    const loading = document.createElement('div');
    loading.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
    loading.innerHTML = '<div class="text-center text-white"><div class="spinner-border"></div><p>Đang nhập dữ liệu...</p></div>';
    document.body.appendChild(loading);

    try {
        const buffer = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = () => reject(new Error('Lỗi đọc file'));
            reader.readAsArrayBuffer(file);
        });

        const workbook = XLSX.read(buffer, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        if (rows.length < 2) throw new Error('File không có dữ liệu!');

        const headers = rows[0].map(h => String(h).trim().toUpperCase());
        const headerMap = {
            'TÊN': 'name',
            'TÊN CÔNG TY': 'company_name',
            'MÃ SỐ THUẾ': 'tax_code',
            'ĐIỆN THOẠI': 'phone',
            'EMAIL': 'email',
            'ĐỊA CHỈ': 'address',
            'MÃ ĐƠN VỊ NSNN': 'budget_unit_code',
            'SỐ HỘ CHIẾU': 'passport_no',
            'NV PHỤ TRÁCH': 'crm_owner',
            'NV PHU TRACH': 'crm_owner',
        };

        let ok = 0;
        let fail = 0;
        for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            const obj = {};
            Object.keys(headerMap).forEach(key => {
                const idx = headers.indexOf(key);
                if (idx !== -1) obj[headerMap[key]] = String(row[idx] || '').trim();
            });
            if (!obj.name) continue;

            const res = await fetch('/api/customers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(obj),
            });
            if (res.ok) ok++;
            else fail++;
        }

        loadCustomers();
        alert(`Nhập xong: ${ok} thành công${fail ? `, ${fail} lỗi` : ''}.`);
    } catch (e) {
        alert('Lỗi: ' + e.message);
    } finally {
        loading.remove();
    }
}

function refreshOwnerDisplay() {
    if (customerTableCtrl) {
        customerTableCtrl.setData(customers);
    } else {
        renderCustomerRows(customers);
    }
}

function bootstrapCustomersPage() {
    initCustomerTable();
    loadCustomers();
    loadSalesStaffOptions().then(() => refreshOwnerDisplay()).catch(() => {});
}

document.getElementById('searchInput')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') searchCustomers();
});

document.getElementById('btnClearCustomerColFilters')?.addEventListener('click', () => customerTableCtrl?.clearColumnFilters());

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrapCustomersPage);
} else {
    bootstrapCustomersPage();
}
</script>

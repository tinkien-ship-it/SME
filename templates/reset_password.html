{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu - KETO{% endblock %}
{% block content %}
<style>
    nav.navbar, footer.footer { display: none !important; }
    .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
</style>

<div class="login-container">
    <div class="card border-0 shadow-lg" style="max-width: 500px; width: 100%; border-radius: 15px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">MẬT KHẨU MỚI</h2>
                <p class="text-muted">Vui lòng thiết lập mật khẩu an toàn hơn</p>
            </div>

            <form method="POST" onsubmit="return validateForm()">
                <div class="mb-3">
                    <label class="form-label fw-medium">Mật khẩu mới</label>
                    <input type="password" id="password" name="password" class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirm_password" class="form-control form-control-lg" required>
                    <div id="error-msg" class="text-danger small mt-1"></div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">CẬP NHẬT MẬT KHẨU</button>
            </form>
        </div>
    </div>
</div>

<script>
function validateForm() {
    const p = document.getElementById('password').value;
    const cp = document.getElementById('confirm_password').value;
    const msg = document.getElementById('error-msg');
    
    if (p !== cp) {
        msg.innerText = "Mật khẩu xác nhận không khớp!";
        return false;
    }
    return true;
}
</script>
{% endblock %}

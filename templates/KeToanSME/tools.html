{% extends "KeToanSME/_layout.html" %}
{% block title %}SME — Danh mục CCDC{% endblock %}
{% block sme_content %}
<div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
  <div>
    <h4 class="fw-bold mb-1">Danh mục công cụ dụng cụ</h4>
    <p class="text-muted small mb-0">InStock → Active (bắt đầu phân bổ) · thanh lý Disposed</p>
  </div>
  <div class="d-flex gap-2">
    <select id="fStatus" class="form-select form-select-sm" style="width:140px">
      <option value="">Tất cả</option>
      <option value="InStock">InStock</option>
      <option value="Active">Active</option>
      <option value="Disposed">Disposed</option>
    </select>
    <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('SME_CCDC') }}">Dashboard</a>
    <a class="btn btn-outline-primary btn-sm" href="{{ url_for('SME_import') }}">Nhập CCDC</a>
  </div>
</div>
<div class="card shadow-sm border-0"><div class="table-responsive">
<table class="table table-sm mb-0"><thead class="table-light"><tr>
  <th>Mã</th><th>Tên</th><th>CN</th><th class="text-end">Nguyên giá</th><th>Tháng PB</th><th>TT</th><th></th>
</tr></thead><tbody id="tbody"></tbody></table>
</div></div>
{% endblock %}
{% block sme_scripts %}
<script>
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n||0));
async function load(){
  const q=fStatus.value?('?status='+encodeURIComponent(fStatus.value)):'';
  const res=await fetch('/api/sme/tools'+q); const json=await res.json();
  tbody.innerHTML=(json.data||[]).map(r=>`<tr>
    <td class="fw-bold">${r.ma_ccdc||''}</td><td>${r.ten_ccdc||''}</td>
    <td class="small">${r.branch_code||'HQ'}</td>
    <td class="text-end">${fmt(r.nguyen_gia||r.gia_mua_chua_thue||0)}</td>
    <td>${r.so_thang_phan_bo||''}</td><td>${r.tinh_trang||''}</td>
    <td class="text-nowrap">
      ${r.tinh_trang==='InStock'?`<button class="btn btn-sm btn-outline-success" onclick="act(${r.id})">Đưa vào dùng</button>`:''}
      ${r.tinh_trang!=='Disposed'?`<button class="btn btn-sm btn-outline-danger ms-1" onclick="scrap(${r.id})">Thanh lý</button>`:''}
    </td>
  </tr>`).join('')||'<tr><td colspan="7" class="text-muted text-center">Chưa có CCDC — nhập qua phiếu nhập kho</td></tr>';
}
async function act(id){
  if(!confirm('Đưa CCDC vào sử dụng (Active)?')) return;
  const res=await fetch('/api/sme/tools/'+id+'/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const json=await res.json(); if(!json.success) return alert(json.error||'Lỗi'); load();
}
async function scrap(id){
  if(!confirm('Thanh lý CCDC này?')) return;
  const res=await fetch('/api/sme/tools/'+id+'/scrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:'Thanh lý CCDC'})});
  const json=await res.json(); if(!json.success) return alert(json.error||'Lỗi'); load();
}
fStatus.onchange=load; load();
</script>
{% endblock %}

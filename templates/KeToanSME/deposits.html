{% extends "KeToanSME/_layout.html" %}
{% block title %}SME — Ký quỹ{% endblock %}
{% block sme_content %}
<div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
  <div><h4 class="fw-bold mb-1">Ký quỹ / ký cược</h4><p class="text-muted small mb-0">Đặt cọc 138 · nhận cọc 344 · hoàn trả</p></div>
  <button class="btn btn-primary" id="btnNew">Lập chứng từ</button>
</div>
<div class="card shadow-sm border-0"><div class="table-responsive">
<table class="table mb-0"><thead class="table-light"><tr>
  <th>Số</th><th>Ngày</th><th>Loại</th><th>Đối tượng</th><th class="text-end">Số tiền</th><th>TK</th><th></th>
</tr></thead><tbody id="tbody"></tbody></table>
</div></div>
<div class="modal fade" id="modal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Ký quỹ</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="mb-2"><label class="form-label small">Ngày</label><input type="date" id="fDate" class="form-control"></div>
    <div class="mb-2"><label class="form-label small">Loại</label>
      <select id="fDir" class="form-select">
        <option value="placed">Đặt cọc đi (Nợ 138)</option>
        <option value="received">Nhận cọc (Có 344)</option>
        <option value="refund_placed">Thu hồi cọc đã đặt</option>
        <option value="refund_received">Trả lại cọc đã nhận</option>
      </select>
    </div>
    <div class="mb-2"><label class="form-label small">Đối tượng</label><input type="text" id="fParty" class="form-control"></div>
    <div class="mb-2"><label class="form-label small">Số tiền</label><input type="number" id="fAmt" class="form-control" step="1000"></div>
    <div class="mb-2"><label class="form-label small">Hình thức</label><select id="fPay" class="form-select"><option value="bank">NH</option><option value="cash">TM</option></select></div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary" id="btnSave">Ghi sổ</button></div>
</div></div></div>
{% endblock %}
{% block sme_scripts %}
<script>
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n||0));
fDate.value=new Date().toISOString().slice(0,10);
const labels={placed:'Đặt cọc',received:'Nhận cọc',refund_placed:'Thu hồi',refund_received:'Trả lại'};
async function load(){
  const res=await fetch('/api/sme/deposits'); const json=await res.json();
  tbody.innerHTML=(json.data||[]).map(r=>`<tr>
    <td class="fw-bold">${r.doc_no}</td><td>${(r.doc_date||'').slice(0,10)}</td>
    <td>${labels[r.direction]||r.direction}</td><td>${r.party_name}</td>
    <td class="text-end">${fmt(r.amount)}</td><td>${r.deposit_account}</td>
    <td><button class="btn btn-sm btn-outline-danger" onclick="voidDep(${r.id})">Hủy</button></td>
  </tr>`).join('')||'<tr><td colspan="7" class="text-muted text-center">Chưa có</td></tr>';
}
async function voidDep(id){
  if(!confirm('Hủy chứng từ ký quỹ (đảo bút toán)?')) return;
  const res=await fetch('/api/sme/deposits/'+id+'/void',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const json=await res.json(); if(!json.success) return alert(json.error||'Lỗi'); load();
}
btnNew.onclick=()=>new bootstrap.Modal(document.getElementById('modal')).show();
btnSave.onclick=async()=>{
  const payload={date:fDate.value,direction:fDir.value,party_name:fParty.value,amount:parseFloat(fAmt.value)||0,payment_method:fPay.value};
  const res=await fetch('/api/sme/deposits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const json=await res.json(); if(!json.success) return alert(json.error||'Lỗi');
  bootstrap.Modal.getInstance(document.getElementById('modal')).hide(); alert('Đã lập '+json.data.doc_no); load();
};
load();
</script>
{% endblock %}

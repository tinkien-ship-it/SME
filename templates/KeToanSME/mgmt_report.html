{% extends "KeToanSME/_layout.html" %}
{% block title %}Báo cáo quản trị SME{% endblock %}
{% block sme_head %}
<style>
.money{font-family:ui-monospace,Consolas,monospace;text-align:right}
</style>
{% endblock %}
{% block sme_content %}

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
      <div>
        <h4 class="fw-bold mb-1">Báo cáo quản trị</h4>
        <p class="text-muted small mb-0">P&amp;L theo tháng từ nhật ký bút toán (511 / 632 / 641–642…)</p>
      </div>
      <div class="d-flex gap-2 align-items-end">
        <div><label class="form-label small mb-1">Năm</label><input type="number" id="y" class="form-control form-control-sm" style="width:100px"></div>
        <div><label class="form-label small mb-1">Từ tháng</label><select id="pf" class="form-select form-select-sm" style="width:100px"></select></div>
        <div><label class="form-label small mb-1">Đến tháng</label><select id="pt" class="form-select form-select-sm" style="width:100px"></select></div>
        <button class="btn btn-primary btn-sm" id="btnLoad">Xem</button>
      </div>
    </div>
    <div class="row g-3 mb-3" id="kpi"></div>
    <div class="card border-0 shadow-sm mb-3"><div class="card-body"><canvas id="chart" height="120"></canvas></div></div>
    <div class="card border-0 shadow-sm"><div class="card-body" id="tbl"></div></div>
{% endblock %}
{% block sme_scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function(){
  const now=new Date(); const yEl=document.getElementById('y');
  const pf=document.getElementById('pf'); const pt=document.getElementById('pt');
  yEl.value=now.getFullYear();
  for(let m=1;m<=12;m++){ pf.add(new Option(m,m)); pt.add(new Option(m,m)); }
  pf.value='1'; pt.value=String(now.getMonth()+1);
  const money=v=>Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:0});
  let chart;
  async function load(){
    try{
      const res=await fetch(`/api/sme/mgmt-report?year=${yEl.value}&period_from=${pf.value}&period_to=${pt.value}`);
      const data=await res.json();
      if(!data.success) throw new Error(data.error||'Lỗi');
      const d=data.data||{};
      document.getElementById('kpi').innerHTML=`
        <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="small text-muted">Doanh thu</div><div class="fs-5 fw-bold text-primary">${money(d.revenue)}</div></div></div></div>
        <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="small text-muted">LN gộp</div><div class="fs-5 fw-bold text-success">${money(d.gross_profit)}</div><div class="small">${d.gross_margin_pct||0}%</div></div></div></div>
        <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="small text-muted">Chi phí</div><div class="fs-5 fw-bold">${money(d.expenses)}</div></div></div></div>
        <div class="col-md-3"><div class="card border-0 shadow-sm"><div class="card-body"><div class="small text-muted">LN thuần (ước)</div><div class="fs-5 fw-bold ${d.profit>=0?'text-success':'text-danger'}">${money(d.profit)}</div><div class="small">${d.margin_pct||0}%</div></div></div></div>`;
      const months=d.monthly||[];
      if(chart) chart.destroy();
      chart=new Chart(document.getElementById('chart'),{
        type:'bar',
        data:{labels:months.map(m=>m.label),datasets:[
          {label:'Doanh thu',data:months.map(m=>m.revenue),backgroundColor:'#0d6efd88'},
          {label:'Giá vốn',data:months.map(m=>m.cogs),backgroundColor:'#fd7e1488'},
          {label:'Chi phí',data:months.map(m=>m.expenses),backgroundColor:'#6c757d88'},
          {label:'LN',data:months.map(m=>m.profit),type:'line',borderColor:'#198754',tension:.2}
        ]},
        options:{responsive:true,scales:{y:{beginAtZero:true}}}
      });
      let html='<table class="table table-sm"><thead><tr><th>Tháng</th><th class="text-end">DT</th><th class="text-end">GV</th><th class="text-end">CP</th><th class="text-end">LN</th></tr></thead><tbody>';
      months.forEach(m=>{ html+=`<tr><td>${m.label}</td><td class="money">${money(m.revenue)}</td><td class="money">${money(m.cogs)}</td><td class="money">${money(m.expenses)}</td><td class="money">${money(m.profit)}</td></tr>`; });
      html+='</tbody></table>';
      document.getElementById('tbl').innerHTML=html;
    }catch(e){ document.getElementById('tbl').innerHTML=`<div class="text-danger">${e.message}</div>`; }
  }
  document.getElementById('btnLoad').addEventListener('click', load);
  load();
})();
</script>
{% endblock %}

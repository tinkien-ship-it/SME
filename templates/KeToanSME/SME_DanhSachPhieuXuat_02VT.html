{% extends "KeToanSME/_layout.html" %}
{% block title %}Phiếu xuất kho 02-VT{% endblock %}
{% block sme_content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <div>
    <h4 class="fw-bold mb-1">Danh sách phiếu xuất kho <span class="badge bg-warning text-dark">02-VT</span></h4>
    <p class="text-muted small mb-0">Doanh nghiệp TT99/TT58 — không dùng mẫu 04-VT HKD</p>
  </div>
</div>
<div class="card shadow-sm border-0 mb-3">
  <div class="card-body row g-2 align-items-end">
    <div class="col-md-3"><label class="form-label small fw-bold">Từ ngày</label><input type="date" id="fromDate" class="form-control"></div>
    <div class="col-md-3"><label class="form-label small fw-bold">Đến ngày</label><input type="date" id="toDate" class="form-control"></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" id="btnLoad">Tải</button></div>
  </div>
</div>
<div class="card shadow-sm border-0">
  <div class="table-responsive">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light"><tr>
        <th>Số PX</th><th>Ngày</th><th>Khách hàng</th><th class="text-end">Giá trị</th><th>Ghi chú</th><th></th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="6" class="text-center text-muted py-4">Đang tải…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const fmt = n => new Intl.NumberFormat('vi-VN').format(Math.round(n||0));
function todayISO(){ return new Date().toISOString().slice(0,10); }
document.getElementById('fromDate').value = todayISO().slice(0,8)+'01';
document.getElementById('toDate').value = todayISO();

async function loadList(){
  const q = new URLSearchParams({from: fromDate.value, to: toDate.value});
  const res = await fetch('/api/sme/stock-out-vouchers?'+q);
  const json = await res.json();
  const tbody = document.getElementById('tbody');
  if(!json.success){ tbody.innerHTML = `<tr><td colspan="6" class="text-danger text-center">${json.error||'Lỗi'}</td></tr>`; return; }
  if(!json.data.length){ tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Chưa có phiếu xuất</td></tr>'; return; }
  tbody.innerHTML = json.data.map(r => `<tr>
    <td class="fw-bold">${r.voucher_no||'—'}</td>
    <td>${fmtDateVi(r.date)}</td>
    <td>${r.customer_name||''}</td>
    <td class="text-end fw-bold">${fmt(r.total_amount)}</td>
    <td class="small">${r.note||''}</td>
    <td class="text-nowrap">
      <a class="btn btn-sm btn-outline-primary" target="_blank" href="/SME_PhieuXuatKho/in/${r.id}">In 02-VT</a>
      <button type="button" class="btn btn-sm btn-outline-danger ms-1" data-del="${r.id}" data-no="${r.voucher_no||''}">Xóa</button>
    </td>
  </tr>`).join('');
  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del');
      const no = btn.getAttribute('data-no') || id;
      if (!confirm(`Xóa phiếu xuất kho 02-VT ${no}?\nCác bút toán liên quan (Nợ 157 / GV bán…) cũng sẽ bị xóa nếu kỳ đang mở.`)) return;
      const reason = prompt('Lý do xóa:', 'Xóa phiếu xuất kho 02-VT') || 'Xóa phiếu xuất kho 02-VT';
      try {
        const res = await fetch('/api/sme/stock-out-vouchers/' + id, {
          method: 'DELETE',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ reason }),
        });
        const j = await res.json();
        if (!j.success) throw new Error(j.error || 'Không xóa được');
        alert(j.message || j.data?.message || 'Đã xóa');
        loadList();
      } catch (e) {
        alert(e.message || e);
      }
    });
  });
}
document.getElementById('btnLoad').onclick = loadList;
loadList();
</script>
{% endblock %}

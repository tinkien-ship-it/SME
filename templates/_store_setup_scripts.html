<script>
async function uploadBusinessLogo() {
    const input = document.getElementById('businessLogoInput');
    const file = input?.files?.[0];
    if (!file) {
        notifyUser('Cảnh báo', 'Chọn file logo trước khi tải lên', 'warning');
        return;
    }
    const fd = new FormData();
    fd.append('logo', file);
    try {
        const res = await fetch('/api/settings/business-logo', { method: 'POST', body: fd, credentials: 'same-origin' });
        const data = await res.json();
        if (!data.success) {
            notifyUser('Lỗi', data.error || 'Không tải được logo', 'error');
            return;
        }
        notifyUser('Thành công', data.message || 'Đã lưu logo', 'success');
        setTimeout(() => location.reload(), 800);
    } catch (err) {
        notifyUser('Lỗi', err.message || 'Lỗi kết nối', 'error');
    }
}

async function resetBusinessLogoDefault() {
    const ok = typeof Swal !== 'undefined'
        ? (await Swal.fire({
            title: 'Đặt lại cờ Việt Nam?',
            text: 'Logo tùy chỉnh sẽ bị gỡ',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Đặt lại',
            cancelButtonText: 'Hủy',
        })).isConfirmed
        : confirm('Đặt lại logo mặc định (cờ Việt Nam)?');
    if (!ok) return;
    try {
        const res = await fetch('/api/settings/business-logo', { method: 'DELETE', credentials: 'same-origin' });
        const data = await res.json();
        if (!data.success) {
            notifyUser('Lỗi', data.error || 'Không đặt lại được', 'error');
            return;
        }
        notifyUser('Đã cập nhật', data.message || '', 'success');
        setTimeout(() => location.reload(), 800);
    } catch (err) {
        notifyUser('Lỗi', err.message || 'Lỗi kết nối', 'error');
    }
}

function notifyUser(title, text, icon) {
    if (typeof Swal !== 'undefined') Swal.fire({ icon: icon || 'info', title, text });
    else alert(title + (text ? ': ' + text : ''));
}

function onBankBinChange(selectEl) {
    const opt = selectEl.options[selectEl.selectedIndex];
    const bin = opt.value;
    const bankNameInput = document.getElementById('bank_name_input');
    const bankCodeInput = document.getElementById('bank_code_input');
    if (!bankCodeInput) return;
    if (bin && bin !== 'custom') {
        bankCodeInput.value = bin;
        if (bankNameInput && opt.dataset.name) {
            bankNameInput.value = opt.dataset.name;
        }
    }
    updateQrPreview();
}

function syncBankSelectFromInputs() {
    const bankCodeInput = document.getElementById('bank_code_input');
    const bankSelect = document.getElementById('bank_code_select');
    if (!bankCodeInput || !bankSelect) return;
    const code = (bankCodeInput.value || '').trim();
    let matched = false;
    for (const opt of bankSelect.options) {
        if (opt.value && opt.value === code) {
            bankSelect.value = code;
            matched = true;
            break;
        }
    }
    if (!matched && code) bankSelect.value = 'custom';
}

function updateQrPreview() {
    const box = document.getElementById('qrPreviewBox');
    const bin = document.getElementById('bank_code_input')?.value?.trim();
    const acc = document.getElementById('bank_account_input')?.value?.trim();
    if (!box) return;
    if (!bin || !acc) {
        box.innerHTML = 'Nhập STK và mã BIN để xem mẫu VietQR';
        return;
    }
    const holder = document.querySelector('[name="account_holder"]')?.value?.trim() || '';
    const url = `https://img.vietqr.io/image/${bin}-${acc}-compact2.jpg?amount=100000&addInfo=DH000001&accountName=${encodeURIComponent(holder)}`;
    box.innerHTML = `<img src="${url}" alt="Mẫu VietQR" onerror="this.parentElement.innerHTML='Không tạo được QR — kiểm tra BIN/STK'">`;
}

function updateVietqrBadge(data) {
    const badge = document.getElementById('vietqrStatusBadge');
    if (!badge || !data?.vietqr) return;
    if (data.vietqr.ready) {
        badge.className = 'badge bg-success';
        badge.textContent = 'VietQR: Sẵn sàng';
    } else {
        badge.className = 'badge bg-warning text-dark';
        const missing = (data.vietqr.missing || []).join(', ');
        badge.textContent = missing ? ('VietQR: Thiếu ' + missing) : 'VietQR: Chưa đủ thông tin';
    }
}

async function loadVietqrStatus() {
    try {
        const res = await fetch('/api/settings/payment-bank');
        const data = await res.json();
        if (data.success) updateVietqrBadge(data);
    } catch (e) { /* ignore */ }
}

function collectFormData(form) {
    const data = {};
    new FormData(form).forEach((value, key) => { data[key] = value; });
    return data;
}

document.getElementById('storeSetupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }
    const payload = collectFormData(form);
    const btn = form.querySelector('[type="submit"]');
    btn.disabled = true;
    try {
        const res = await fetch('/api/settings/business', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.success) {
            if (typeof Swal !== 'undefined') {
                Swal.fire({ icon: 'success', title: 'Đã lưu', text: data.message || 'Cập nhật thiết lập thành công', timer: 2200, showConfirmButton: false });
            } else {
                alert(data.message || 'Đã lưu thiết lập');
            }
            updateQrPreview();
            loadVietqrStatus();
        } else {
            const msg = data.error || 'Không lưu được';
            if (typeof Swal !== 'undefined') Swal.fire('Lỗi', msg, 'error');
            else alert(msg);
        }
    } catch (err) {
        const msg = err.message || 'Lỗi kết nối';
        if (typeof Swal !== 'undefined') Swal.fire('Lỗi', msg, 'error');
        else alert(msg);
    } finally {
        btn.disabled = false;
    }
});

function fillTenantSmtp(s) {
    s = s || {};
    const el = id => document.getElementById(id);
    if (!el('smtpEnabled')) return;
    el('smtpEnabled').checked = !!s.enabled;
    el('smtpServer').value = s.server || '';
    el('smtpPort').value = s.port || 587;
    el('smtpSender').value = s.sender || '';
    el('smtpFromName').value = s.from_name || '';
    el('smtpPassword').value = '';
    el('smtpPassword').placeholder = s.password_set
        ? '******** (đã lưu — nhập mới để đổi)' : 'Mật khẩu ứng dụng';
    el('smtpTestTo').value = s.sender || '';
    el('smtpStatus').textContent = s.configured
        ? 'Đã cấu hình — có thể gửi báo giá / đơn mua / CRM.'
        : (s.enabled ? 'Đã bật nhưng thiếu server / email / mật khẩu.' : 'Chưa bật — sẽ dùng SMTP hệ thống nếu có.');
}

async function loadTenantSmtp() {
    try {
        const res = await fetch('/api/settings/email');
        const data = await res.json();
        if (data.success) fillTenantSmtp(data.smtp);
        else if (data.enabled !== undefined) fillTenantSmtp(data);
    } catch (e) { /* ignore */ }
}

document.getElementById('btnSaveSmtp')?.addEventListener('click', async () => {
    const body = {
        enabled: document.getElementById('smtpEnabled').checked,
        server: document.getElementById('smtpServer').value,
        port: document.getElementById('smtpPort').value,
        sender: document.getElementById('smtpSender').value,
        from_name: document.getElementById('smtpFromName').value,
    };
    const pw = (document.getElementById('smtpPassword').value || '').trim();
    if (pw) body.password = pw;
    try {
        const res = await fetch('/api/settings/email', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!data.success) {
            notifyUser('Lỗi', data.error || 'Không lưu được', 'error');
            return;
        }
        fillTenantSmtp(data.smtp);
        notifyUser('Đã lưu', 'Cấu hình email doanh nghiệp', 'success');
    } catch (err) {
        notifyUser('Lỗi', err.message || 'Lỗi kết nối', 'error');
    }
});

document.getElementById('btnTestSmtp')?.addEventListener('click', async () => {
    try {
        const res = await fetch('/api/settings/email/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ to_email: document.getElementById('smtpTestTo').value }),
        });
        const data = await res.json();
        if (!data.success) notifyUser('Lỗi', data.error || 'Gửi thử thất bại', 'error');
        else notifyUser('Thành công', data.message || 'Đã gửi email thử', 'success');
    } catch (err) {
        notifyUser('Lỗi', err.message || 'Lỗi kết nối', 'error');
    }
});

document.addEventListener('DOMContentLoaded', () => {
    syncBankSelectFromInputs();
    updateQrPreview();
    loadVietqrStatus();
    loadTenantSmtp();
    ['bank_code_input', 'bank_account_input'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', updateQrPreview);
    });
    document.querySelector('[name="account_holder"]')?.addEventListener('input', updateQrPreview);
});
</script>

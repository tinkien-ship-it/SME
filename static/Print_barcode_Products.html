<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>In Tem Giá</title>
    <style>
        @page { size: A4; margin: 6mm 8mm 6mm 6mm; }
        body { margin:0; padding:0; font-family: Arial, sans-serif; }
        table { width:100%; border-collapse:collapse; table-layout:fixed; }
        td { width:50mm; height:28mm; padding:0; text-align:center; vertical-align:top; }
        .label {
            width:48mm; height:26mm; margin:1mm auto;
            border:1px dashed #999; background:white;
            padding:1mm; box-sizing:border-box;
            display:flex; flex-direction:column; justify-content:flex-start; gap:0.8mm;
        }
        .barcode { width:100%; height:44px; margin:0 0 0.8mm 0; }
        .name { font-weight:bold; font-size:11.5px; margin:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
        .price { font-weight:900; color:#d32f2f; font-size:16px; }
        .unit { font-size:12px; color:#d32f2f; font-weight:bold; margin-left:1px; }
        .code { font-family:'Courier New',monospace; font-size:10px; font-weight:bold; margin:0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body onload="generateAndPrint()">
<table id="labelTable"></table>
<script>
function generateAndPrint() {
    const items = window.itemsData || [];
    const table = document.getElementById('labelTable');
    let html = '';
    let index = 0;

    items.forEach(item => {
        {
        for (let i = 0; i < item.print_qty; i++) {
            if (index % 4 === 0) html += '<tr>';
            html += `
                <td>
                    <div class="label">
                        <svg class="barcode" id="bc${index}"></svg>
                        <div class="name">${item.name}</div>
                        <div>
                            <span class="price">${item.price}đ</span>
                            <span class="unit">${item.unit ? '/'+item.unit : ''}</span>
                        </div>
                        <div class="code">${item.barcode}</div>
                    </div>
                </td>`;
            if ((index + 1) % 4 === 0) html += '</tr>';
            index++;
        }
    });

    while (index % 4 !== 0) {
        html += '<td></td>';
        index++;
        if (index % 4 === 0) html += '</tr>';
    }

    table.innerHTML = html;

    // Tạo mã vạch
    items.forEach((item, itemIdx) => {
        for (let i = 0; i < item.print_qty; i++) {
            const svgId = 'bc' + (itemIdx * 1000 + i); // Đảm bảo ID duy nhất
            const svg = document.getElementById(svgId);
            if (svg && item.barcode) {
                JsBarcode(svg, item.barcode, {
                    format: "CODE128",
                    width: 2.3,
                    height: 44,
                    displayValue: false,
                    margin: 6,
                    flat: true
                });
            }
        }
    });

    setTimeout(() => window.print(), 600);
}
</script>
</body>
</html>
